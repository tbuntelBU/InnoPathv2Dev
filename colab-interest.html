<!doctype html>
<html>
  <head>
    <title>Recording your answer...</title>
  </head>
  <body>
    <p>Recording your answer...</p>

    <script>
      const params = new URLSearchParams(window.location.search);
      const reply = params.get("reply");

      const zapierUrl = new URL("https://hooks.zapier.com/hooks/catch/10801929/4decgjn/");
      zapierUrl.searchParams.set("reply", reply || "");
      zapierUrl.searchParams.set("submitted_at", new Date().toISOString());
      zapierUrl.searchParams.set("page_url", window.location.href);

      fetch(zapierUrl.toString(), {
        method: "GET"
      })
      .catch(error => {
        console.error("Error sending response to Zapier:", error);
      })
      .finally(() => {
        window.location.href = "https://www.bu.edu/innovate/programs-competitions/innovation-pathway/innovation-pathway-details-for-current-teams/innovation-co-lab/";
      });
    </script>
  </body>
</html>
