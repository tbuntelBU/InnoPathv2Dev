<!doctype html>
<html>
  <head>
    <title>Recording your answer...</title>
  </head>
  <body>
    <p>Recording your answer...</p>

    <script>
      const params = new URLSearchParams(window.location.search);

      const recipientId = params.get("recipient_id");
      const answer = params.get("answer");

      fetch("https://hooks.zapier.com/hooks/catch/10801929/4decgjn/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          recipient_id: recipientId,
          answer: answer,
          submitted_at: new Date().toISOString()
        })
      }).finally(() => {
        window.location.href = "https://bu.edu/innovate";
      });
    </script>
  </body>
</html>
